name: CI
on:
  pull_request:
  # Every branch, not a prefix allowlist: the lane branch names in tasks/BOARD.md
  # (payments/*, backend/*, frontend/*, ml-engineer/*, ...) must all get CI, and a
  # branch that silently skips checks is worse than no CI at all.
  push:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: OpenAPI lint
        run: npm run lint:openapi
      - name: Strict typecheck
        run: npm run typecheck
      - name: Bootstrap tests
        run: npm test
      - name: Secret scan
        run: npm run secrets
      - name: Seed smoke test
        run: npm run seed
